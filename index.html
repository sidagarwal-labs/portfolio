    <script>
      (function () {
        var search = new URLSearchParams(window.location.search);
        var redirectedPath = search.get("p");
        if (!redirectedPath) {
          return;
        }

        var redirectedQuery = search.get("q");
        var basePath = window.location.pathname.replace(/\/$/, "");
        var restoredPath = redirectedPath.replace(/~and~/g, "&");
        var restoredQuery = redirectedQuery ? "?" + redirectedQuery.replace(/~and~/g, "&") : "";

        window.history.replaceState(null, "", basePath + restoredPath + restoredQuery + window.location.hash);
      })();
    </script>
