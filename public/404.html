<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Redirecting…</title>
    <script>
      (function () {
        var routePath = window.location.pathname;
        var search = window.location.search ? "&q=" + window.location.search.slice(1).replace(/&/g, "~and~") : "";
        var target = "/?p=" + routePath.replace(/&/g, "~and~") + search + window.location.hash;

        window.location.replace(target);
      })();
    </script>
  </head>
  <body></body>
</html>
