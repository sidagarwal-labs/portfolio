name: Deploy Portfolio

on:
  push:
    branches: [main]
  workflow_dispatch:
  # Daily rebuild so the AI leaderboards (Epoch AI benchmarks) and the GitHub app snapshot pick up new data.
  schedule:
    - cron: "17 9 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps
        env:
          # The site never runs onnxruntime-node; skip its CUDA download on Linux runners.
          ONNXRUNTIME_NODE_INSTALL: skip

      - name: Refresh leaderboard data
        run: npm run data:leaderboards

      # Keeps the committed snapshot if the token cannot read the data (see README, GitHub app data).
      - name: Refresh GitHub data
        run: npm run data:github
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build app
        run: npm run build
        env:
          VITE_FINNHUB_KEY: ${{ secrets.VITE_FINNHUB_KEY }}
          VITE_GITHUB_PROXY_URL: ${{ vars.GITHUB_PROXY_URL }}

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4